<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification - Step 1</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <!-- Native HTML Form: Switch method="GET" to method="POST" when connecting to a backend server -->
    <form action="verify.html" method="GET" class="form-wrapper" id="step1Form">
        <div class="wrapper">
            <div class="step-view active">
                <h2>Enter your phone number</h2>
                <div class="instructions">
                    WhatsApp will need to verify your phone number. Carrier charges may apply.
                </div>

                <div class="input-group-container">
                    <!-- Country Selector with explicit 'name' attribute -->
                    <div class="select-wrapper">
                        <label for="countrySelect">Country</label>
                        <select id="countrySelect" name="country_name">
                            <option value="+234" data-code="234">Nigeria (+234)</option>
                            <option value="+1" data-code="1">United States (+1)</option>
                            <option value="+44" data-code="44">United Kingdom (+44)</option>
                            <option value="+91" data-code="91">India (+91)</option>
                            <option value="+27" data-code="27">South Africa (+27)</option>
                            <option value="+254" data-code="254">Kenya (+254)</option>
                        </select>
                    </div>

                    <!-- Phone Input Row with named parameters -->
                    <div class="phone-row">
                        <!-- Country Code Field (named 'cc') -->
                        <input type="text" id="countryCodeInput" name="cc" class="cc-input" value="+234" readonly>
                        
                        <!-- Phone Number Field (named 'phone') -->
                        <div class="phone-input-wrapper" style="flex-grow: 1;">
                            <label for="phoneNumberInput">Phone number</label>
                            <input type="tel" id="phoneNumberInput" name="phone" placeholder="812 345 6789" autocomplete="tel-national" required autofocus>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Persistent Submit Button -->
        <div class="action-container">
            <button type="submit" class="btn-next" id="nextBtn" disabled>Next</button>
        </div>
    </form>

    <script src="static/script.js"></script>
</body>
</html>
