<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification - Step 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <!-- ================= STEP 1 VIEW ================= -->
        <div class="step-view active">
            <h2>Enter your phone number</h2>
            <div class="instructions">
                WhatsApp will need to verify your phone number. Carrier charges may apply.
            </div>

            <div class="input-group-container">
                <!-- Country Selector -->
                <div class="select-wrapper">
                    <label for="countrySelect">Country</label>
                    <select id="countrySelect">
                        <option value="+234" data-code="234">Nigeria (+234)</option>
                        <option value="+1" data-code="1">United States (+1)</option>
                        <option value="+44" data-code="44">United Kingdom (+44)</option>
                        <option value="+91" data-code="91">India (+91)</option>
                        <option value="+27" data-code="27">South Africa (+27)</option>
                        <option value="+254" data-code="254">Kenya (+254)</option>
                    </select>
                </div>

                <!-- Phone Input Row -->
                <div class="phone-row">
                    <input type="text" id="countryCodeInput" class="cc-input" value="+234" readonly>
                    <div class="phone-input-wrapper" style="flex-grow: 1;">
                        <label for="phoneNumberInput">Phone number</label>
                        <input type="tel" id="phoneNumberInput" placeholder="812 345 6789" autocomplete="tel-national" autofocus>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Persistent Action Button -->
    <div class="action-container">
        <button class="btn-next" id="nextBtn" disabled>Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
